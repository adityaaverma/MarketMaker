# Phase 0 recorder config — symbols, streams, output.
# Fill in the third symbol after picking a mid-liquidity perp (volume rank ~20-40).

symbols:
  - BTCUSDT
  - ETHUSDT
  - AVAXUSDT # mid-liquidity perp, ~rank 29 by 24h quote volume on 2026-10-11

streams:
  - depth@100ms
  - bookTicker
  # aggTrade intentionally excluded — websocket accepts the subscription
  # but never delivers (docs/decisions/0001-aggtrade-stream-not-delivering.md).
  # Fetched via REST polling instead (rest_poll.py).

output_dir: data/raw/binance

snapshot:
  rest_endpoint: https://fapi.binance.com/fapi/v1/depth
  interval_seconds: 3600 # hourly + after every reconnect

rest_poll:
  # was 1s — hit Binance's per-minute request-weight limit (429s) once
  # aggTrade + snapshot + premiumIndex + openInterest were all polling.
  agg_trades_interval_seconds: 3
  perp_metrics_interval_seconds: 300

rotation:
  interval_seconds: 3600 # hourly file rotation
  compression: zstd
